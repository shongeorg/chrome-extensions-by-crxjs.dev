<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Player</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header with country select -->
      <header class="header">
        <div class="header-top">
          <span class="logo">📻</span>
          <select id="country-select" class="country-select">
            <option value="Ukraine">🇺🇦 Ukraine</option>
            <option value="United States">🇺🇸 United States</option>
            <option value="United Kingdom">🇬🇧 United Kingdom</option>
            <option value="Germany">🇩🇪 Germany</option>
            <option value="France">🇫🇷 France</option>
            <option value="Poland">🇵🇱 Poland</option>
            <option value="Spain">🇪🇸 Spain</option>
            <option value="Italy">🇮🇹 Italy</option>
            <option value="Canada">🇨🇦 Canada</option>
            <option value="Australia">🇦🇺 Australia</option>
          </select>
        </div>
      </header>

      <!-- Player controls -->
      <div class="player">
        <div class="player-info">
          <div id="station-name" class="station-name">Select a station</div>
          <div id="station-status" class="station-status"></div>
        </div>
        <div class="player-controls">
          <button id="prev-btn" class="control-btn" title="Previous">⏮️</button>
          <button id="play-pause-btn" class="control-btn play-btn" title="Play/Pause">▶️</button>
          <button id="stop-btn" class="control-btn" title="Stop">⏹️</button>
          <button id="next-btn" class="control-btn" title="Next">⏭️</button>
        </div>
        <div class="volume-control">
          <span class="volume-icon">🔊</span>
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80" />
        </div>
      </div>

      <!-- Stations list -->
      <div id="stations-container" class="stations-container">
        <div id="loader" class="loader">
          <div class="loader-spinner"></div>
        </div>
        <div id="stations-list" class="stations-list"></div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
