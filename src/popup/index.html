<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header with converter -->
      <header class="header">
        <div class="converter">
          <div class="converter-row">
            <input type="number" id="amount-from" class="amount-input" value="1" min="0" step="any" />
            <select id="currency-from" class="currency-select"></select>
          </div>
          
          <div class="swap-icon" id="swap-btn">⇅</div>
          
          <div class="converter-row">
            <input type="number" id="amount-to" class="amount-input" min="0" step="any" />
            <select id="currency-to" class="currency-select"></select>
          </div>
        </div>
      </header>

      <!-- Rates body -->
      <div class="rates-container">
        <div id="loader" class="loader">
          <div class="loader-spinner"></div>
        </div>
        <div id="rates-list" class="rates-list"></div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
