<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <h1>Tasks</h1>
      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" />
        <button type="submit" id="add-btn">+</button>
      </form>
      <ul id="todo-list"></ul>
      <div id="todo-stats" class="todo-stats"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
