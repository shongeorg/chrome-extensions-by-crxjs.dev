<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Images</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-left">
          <h1>Stock Images</h1>
        </div>
        <div class="header-actions">
          <select id="api-select" class="api-select">
            <option value="unsplash">Unsplash</option>
            <option value="pexels">Pexels</option>
            <option value="pixabay">Pixabay</option>
          </select>
          <button id="refresh-btn" class="icon-btn" title="New image">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path
                d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
              ></path>
            </svg>
          </button>
        </div>
      </header>

      <div id="status" class="status"></div>

      <div class="image-container">
        <div id="loader" class="loader">
          <div class="loader-spinner"></div>
        </div>
        <img id="random-image" class="random-image" alt="Random stock image" />
        <div id="image-info" class="image-info"></div>
      </div>

      <div class="copy-section">
        <p class="copy-label">Copy image URL:</p>
        <div class="copy-buttons">
          <button class="copy-btn size-btn" data-size="thumb">Thumbnail</button>
          <button class="copy-btn size-btn" data-size="small">Small (400px)</button>
          <button class="copy-btn size-btn" data-size="medium">Medium (800px)</button>
          <button class="copy-btn size-btn" data-size="large">Large (1600px)</button>
          <button class="copy-btn size-btn" data-size="original">Original</button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
